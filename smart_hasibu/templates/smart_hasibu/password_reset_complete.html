{% extends "smart_hasibu/base.html" %}
{% block title %}Password reset | SmartHasibu{% endblock %}
{% block content %}
<section class="wrap registration sh-auth">
  <p class="eyebrow">SmartHasibu · Account recovery</p>
  <div class="card registration-form">
    <h1>Your password has been reset</h1>
    <p>You can now sign in with your new password.</p>
    <p><a class="btn" href="{% url 'smart_hasibu:login' %}">Sign in</a></p>
  </div>
</section>
{% endblock %}
