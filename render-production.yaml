envVarGroups:
  - name: mofirms-retention-secrets
    envVars:
      - key: RETENTION_WEBHOOK_SECRET
        generateValue: true
  - name: mofirms-mpesa-secrets
    envVars:
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false

services:
  - type: web
    name: mofirms-production
    runtime: docker
    region: frankfurt
    plan: 1c-2g
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    preDeployCommand: python manage.py migrate --noinput
    domains:
      - mofirm.co.ke
    disk:
      name: mofirms-private-uploads
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DJANGO_ENVIRONMENT
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DEMO_MODE
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: mofirm.co.ke,www.mofirm.co.ke
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://mofirm.co.ke,https://www.mofirm.co.ke
      - key: DJANGO_TRUST_PROXY_SSL_HEADER
        value: "True"
      - key: DJANGO_HSTS_SECONDS
        value: "0"
      - key: PRIVATE_UPLOAD_ROOT
        value: /var/data/private_uploads
      - key: ANTIVIRUS_ENABLED
        value: "True"
      - key: CLAMSCAN_COMMAND
        value: clamscan
      - key: DATABASE_URL
        fromDatabase:
          name: mofirms-production-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mofirms-production-redis
          type: keyvalue
          property: connectionString
      - key: MPESA_ENVIRONMENT
        value: production
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline
      - key: MPESA_CALLBACK_URL
        value: https://mofirm.co.ke/portal/payments/mpesa/callback/
      - key: RETENTION_WEBHOOK_URL
        value: https://mofirm.co.ke/internal/retention/purge/
      - fromGroup: mofirms-retention-secrets
      - fromGroup: mofirms-mpesa-secrets

  - type: keyvalue
    name: mofirms-production-redis
    region: frankfurt
    plan: 256mb
    maxmemoryPolicy: noeviction
    ipAllowList: []
    persistenceMode: journal-snapshot

  - type: cron
    name: mofirms-retention-purge
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    schedule: "0 1 * * *"
    buildCommand: python -m py_compile mofirms_backend/retention_client.py
    startCommand: python -m mofirms_backend.retention_client
    envVars:
      - key: RETENTION_WEBHOOK_URL
        value: https://mofirm.co.ke/internal/retention/purge/
      - fromGroup: mofirms-retention-secrets

databases:
  - name: mofirms-production-db
    region: frankfurt
    plan: 0.5c-1g
    databaseName: mofirms
    user: mofirms
    ipAllowList: []
